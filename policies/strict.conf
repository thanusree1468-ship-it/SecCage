# SecCage Strict Policy
# Default action: BLOCK
# Only the following system calls are allowed.

MODE STRICT

# Program execution
ALLOW execve

# File operations
ALLOW openat
ALLOW read
ALLOW write
ALLOW close
ALLOW pread64
ALLOW fstat
ALLOW access

# Memory management
ALLOW mmap
ALLOW mprotect
ALLOW munmap
ALLOW brk

# Process/runtime setup
ALLOW arch_prctl
ALLOW set_tid_address
ALLOW set_robust_list
ALLOW rseq

# System information / runtime
ALLOW prlimit64
ALLOW getrandom

# Process termination
ALLOW exit
ALLOW exit_group

# Signal handling
ALLOW rt_sigaction
ALLOW rt_sigprocmask
ALLOW rt_sigreturn
